# 日本語版を GitHub Pages へ公開する。
#
# 上流の版はゲームのデータを持つ非公開リポジトリを secrets 付きで clone し、
# wt_generator.rb をここで走らせていた。そのリポジトリには触れないので、
# 生成は手元で行い (bin/ja build)、生成物をコミットしてある。
# ここは出来上がった src/ を Jekyll でビルドして配信するだけ。
#
#   手元:  bin/ja build  →  git commit  →  git push
#   ここ:  jekyll build  →  deploy-pages
name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 走行中の配信は止めず、待たせる。
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # jekyll-build-pages は source 直下の _config.yml を読む。
      # このリポジトリでは設定がルートにあるので写す。
      - name: Copy _config.yml into src
        run: cp ./_config.yml ./src/_config.yml

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./src
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
