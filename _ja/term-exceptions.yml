# bin/check-terms が指摘しなくてよい語。
#
# 辞書は英語の綴りだけで引くため、同綴りの別語や、本文で自然な言い換えを
# したものが誤検出として上がる。ここに理由つきで登録して黙らせる。
# 理由を必ず書くこと。書けないものは、たいてい本当の不一致。

Reborn:       ゲーム名・都市名。同綴りのトレーナー種別「よみがえりしもの」に引っかかるだけ
Return:       英単語の return（戻る）。技の「おんがえし」ではない
Meteor Grunt: 表は「メテオだんしたっぱ」だが、本文では組織名を会話データに合わせて「チームメテオのしたっぱ」と表記する
Rate:         英単語の rate。出現率の表ヘッダとは無関係
Common:       英単語の common
Cave:         地形としての「どうくつ」。フィールド名の Cave とは別文脈で出る
Psychic:      タイプ名の「エスパー」と技の「サイコキネシス」が同綴り。本文でタイプを指す場合に上がる
Police Officer: 表は「けいかん」だが、本文では自然な日本語として「警官」と表記する
Gentleman:      表は「ジェントルマン」だが、本文では NPC を指す普通名詞なので「紳士」と表記する
Agent:          表は「エージェント」だが、本文では役職を指すので「捜査官」と表記する
Aqua Gang:      表は「アクアだんいん」だが、本文では組織名として「アクア団」と表記する
Magma Gang:     表は「マグマだんいん」だが、本文では組織名として「マグマ団」と表記する
Orderly:        表は「かんごにん」だが、本文では漢字で「看護人」と表記する
Madame:         表は「マダム」だが、本文では「クラウドバリー夫人」のように「夫人」と訳す
Plus:           英単語の plus。とくせいの「プラス」ではない
Entity:         表は「そんざい」だが、本文ではシェイドを指す語なので「この存在」と表記する
Will:           英単語の will。トレーナー名の「ウィル」ではない
Break:          英単語の break。トレーナー名の「ブレーク」ではない
Keeper:         トレーナー種別「まもりびと」と同綴り。章タイトル Sister's Keeper は「妹の番人」
Powder:         道具の「こな類」を指す。技の「ふんじん」ではない
Sweet Kiss:     菓子店の名前「あまいキッス」。技の「てんしのキッス」ではない
Gravity:        バトルパス・グラビティ／グラビティバッジの固有名。技の「じゅうりょく」ではない
Ferris:         観覧車 (Ferris Wheel)。トレーナー名の「フェリス」ではない
Never After: 章タイトル。ゲーム内マップ名の「めでたしはない」とは別に、章題として「めでたくもなし」を採用（決定済み）
