# キーは生成側のコードに書かれている英語そのもの。call site では
# JaNames.ui('Ability:') のように英語を渡して引く。ここに無いキーは
# 英語のまま素通りする。

# --- 見出し・ラベル ---
"VS:":            "VS:"          # 万国共通なので訳さない
