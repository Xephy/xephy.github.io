# 攻略サイトの更新履歴。
#
# 読む人に向けた文で書く。コミットの表題をそのまま持ってこない。
# 「ads.txt を置く」「SEO.md に書き出す」のような、読む側から見えない
# 変更は載せない。
#
# 新しいものを上に足す。日付は公開した日 (JST)、文字列で書く。
#   kind:  new (新機能) / add (追加) / fix (修正) / imp (改善)
#          patch (パッチ) … 日本語化パッチ側の更新はこれ
#   href:  変わった場所。付けると項目からそこへ飛べる (省略可)
#
# 目次ページ (/reborn/) には新しいほうから数件、全部は /reborn/changelog/ に出る。
# 何かを公開したら、bin/ja build の前にここへ1行足すこと。
#
# 日本語化パッチを出したときもここへ足す。パッチとサイトは同じ訳語で
# ひとそろいにしているので、読む人にはどちらの更新も知らせたい。
# 版と何が変わったかを書き、href はその版のタグを直に指す。
#   https://github.com/Xephy/reborn-19.5.43-ja/releases/tag/v19.5.43-ja.13
# latest にすると、次の版を出した時点で過去の項目まで新しい版へ飛んでしまう。

